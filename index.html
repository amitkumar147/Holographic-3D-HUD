<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS PRO HUD - Advanced Rings</title>
<style>
body {
  margin:0; overflow:hidden; background:#000; font-family:'Orbitron',sans-serif; color:#0ff;
}
/* Grid overlay */
.grid-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(circle, rgba(0,255,255,0.05), transparent),
              linear-gradient(#022 1px, transparent 1px),
              linear-gradient(90deg, #022 1px, transparent 1px);
  background-size:100% 100%,40px 40px,40px 40px;
  pointer-events:none; opacity:0.2; z-index:1;
}
/* Target */
.target { position:fixed; top:50%; left:50%; width:260px; height:260px; border-radius:50%; border:2px solid #0ff; box-shadow:0 0 25px #0ff inset; z-index:10; transform: translate(-50%, -50%);}
.target:before, .target:after {content:""; position:absolute; top:50%; left:50%; border-radius:50%; border:1px solid #0ff; animation:pulse 3s infinite; transform:translate(-50%,-50%);}
.target:before{width:180px;height:180px;opacity:0.4;}
.target:after{width:120px;height:120px;opacity:0.2;animation-delay:1.2s;}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.1);}100%{transform:translate(-50%,-50%) scale(1);}}

/* Rotating dots */
.dot-container{position:fixed;top:50%;left:50%;width:3060px;height:3060px;transform:translate(-50%,-50%);border-radius:50%;z-index:100;animation:rotateDots 8s linear infinite;}
.dot{position:absolute;width:6px;height:6px;background:#red;border-radius:50%;top:50%;left:0%;transform:translate(-50%,-50%);box-shadow:0 0 12px #red;animation:dotPulse 1.5s infinite alternate;}
.dot:nth-child(1){ transform:translate(-50%, -50%) rotate(0deg) translateX(180px);}
.dot:nth-child(2){ transform:translate(-50%, -50%) rotate(30deg) translateX(180px);}
.dot:nth-child(3){ transform:translate(-50%, -50%) rotate(60deg) translateX(180px);}
.dot:nth-child(4){ transform:translate(-50%, -50%) rotate(90deg) translateX(180px);}
.dot:nth-child(5){ transform:translate(-50%, -50%) rotate(120deg) translateX(180px);}
.dot:nth-child(6){ transform:translate(-50%, -50%) rotate(150deg) translateX(180px);}
.dot:nth-child(7){ transform:translate(-50%, -50%) rotate(180deg) translateX(180px);}
.dot:nth-child(8){ transform:translate(-50%, -50%) rotate(210deg) translateX(180px);}
.dot:nth-child(9){ transform:translate(-50%, -50%) rotate(240deg) translateX(180px);}
.dot:nth-child(10){ transform:translate(-50%, -50%) rotate(270deg) translateX(180px);}
.dot:nth-child(11){ transform:translate(-50%, -50%) rotate(300deg) translateX(180px);}
.dot:nth-child(12){ transform:translate(-50%, -50%) rotate(330deg) translateX(180px);}
@keyframes rotateDots{0%{transform:translate(-50%,-50%) rotate(0deg);}100%{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes dotPulse{0%{transform: scale(0.6); opacity:0.7;}100%{transform: scale(1.2); opacity:1;}}

/* Advanced Rings */
.ring{
  position:fixed;top:50%;left:50%;border-radius:50%;border:2px solid;transform:translate(-50%,-50%);
  box-shadow:0 0 80px #0ff, 0 0 85px #0ff inset;
}
.ring1{width:280px;height:280px;border-image:linear-gradient(45deg, #0ff,  ) 1; animation:spin1 8s linear infinite, ringPulse 1s ease-in-out infinite alternate;}
.ring2{width:320px;height:320px;border-image:linear-gradient(90deg, #0ff,  ) 1; animation:spin2 60s linear reverse infinite, ringPulse 1s ease-in-out infinite alternate;}
.ring3{width:360px;height:360px;border-image:linear-gradient(135deg, #0ff,  #) 1; animation:spin1 16s linear infinite, ringPulse 1s ease-in-out infinite alternate;}
.ring4{width:400px;height:400px;border-image:linear-gradient(180deg, #0ff, ) 1; animation:spin2 120s linear reverse infinite, ringPulse 1s ease-in-out infinite alternate;}
.ring5{width:440px;height:440px;border-image:linear-gradient(225deg, #0ff,  ) 1; animation:spin1 150s linear infinite, ringPulse 1s ease-in-out infinite alternate;}

@keyframes spin1{0%{transform:translate(-50%,-50%) rotate(0deg);}100%{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes spin2{0%{transform:translate(-50%,-50%) rotate(360deg);}100%{transform:translate(-50%,-50%) rotate(0deg);}}
@keyframes ringPulse{0%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.05);}100%{transform:translate(-50%,-50%) scale(1);}}

/* System Panel */
.panel-pro{position: fixed; top:5%; right:5%; width:250px; height:150px;border:1px solid ;border-radius:15px;background: rgba(0,255,255,0.08);backdrop-filter: blur(10px);padding:15px;box-shadow:0 0 25px inset,0 0 20px ;z-index:20;color:;font-family:'Orbitron',sans-serif;animation:panelGlow 2s infinite alternate;}
.panel-pro h3{margin:0 0 5px 0;font-size:18px;}
.panel-pro p{font-size:14px;opacity:0.8;}

/* Crypto Panel next to System */
.crypto-panel{position:fixed;top:5%;right:370px;width:250px;height:160px;border:1px solid #0ff;border-radius:15px;background: rgba(0,255,255,0.12);backdrop-filter: blur(10px);padding:10px;box-shadow:0 0 20px #0ff inset,0 0 15px #0ff;z-index:20;font-family:'Orbitron',sans-serif;text-align:center;transition:0.3s;}
.crypto-panel h4{margin:0;font-size:16px;}
.crypto-panel .price{font-size:22px;margin-top:5px;opacity:0.9;}
.crypto-panel canvas{width:100%;height:50px;margin-top:5px;}

/* Terminal */
.terminal-pro{position: fixed; bottom:5%; left:50%; transform:translateX(-50%); width:95%; max-width:650px; height:180px; border:1px solid #0ff; border-radius:15px;background: rgba(0,255,255,0.07);backdrop-filter: blur(12px);box-shadow:0 0 25px #0ff inset,0 0 20px ; padding:15px;color:#0ff;font-family:'Courier New',monospace;font-size:15px;overflow-y:auto; z-index:20;animation: terminalGlow 2.5s infinite alternate;}

/* Animations */
@keyframes panelGlow{0%{box-shadow:0 0 25px #0ff inset,0 0 20px #0ff;}50%{box-shadow:0 0 35px #0ff inset,0 0 30px #0ff;}100%{box-shadow:0 0 25px #0ff inset,0 0 20px #0ff;}}
@keyframes terminalGlow{0%{box-shadow:0 0 25px #0ff inset,0 0 20px #0ff;}50%{box-shadow:0 0 35px #0ff inset,0 0 30px #0ff;}100%{box-shadow:0 0 25px #0ff inset,0 0 20px #0ff;}}

/* Mobile */
@media(max-width:600px){.panel-pro{width:180px;height:120px;font-size:12px;}.crypto-panel{width:160px;height:100px;right:190px;font-size:12px;}.terminal-pro{height:120px;width:90%;font-size:12px;}}
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="target"></div>
<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>
<div class="ring ring4"></div>
<div class="ring ring5"></div>
<div class="dot-container">
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
<div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>

<div class="panel-pro">
<h3>SYSTEM DATA</h3>
<p>ID: JARVIS-PRO-V12</p>
<p>Mode: Tactical HUD</p>
<p>Status: ACTIVE</p>
</div>

<div class="crypto-panel">
<h4> BTC / USD </h4>
<div class="price" id="btcPrice">--</div>
<canvas id="sparkline"></canvas>
</div>

<div class="terminal-pro" id="termPro"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// Terminal
function logPro(msg){const t=document.getElementById('termPro');t.innerHTML+="→ "+msg+"<br>";t.scrollTop=t.scrollHeight;}
logPro("BOOTING JARVIS PRO HUD...");
logPro("SYSTEM ONLINE...");
logPro("READY FOR COMMAND...");

// Voice recognition
let listening=false;
try{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const rec=new SR();
  rec.continuous=true; rec.interimResults=false; rec.lang='en-US';
  rec.onresult=e=>{
    const text=e.results[e.results.length-1][0].transcript.toLowerCase();
    logPro("HEARD: "+text);
    if(!listening && text.includes('jarvis')){listening=true;logPro("WAKE WORD DETECTED");}
    else if(listening){
      if(text.includes('price')){logPro("Fetching price...");fetchPrice();}
      if(text.includes('stop')){logPro("LISTENING OFF");listening=false;}
    }
  };
  rec.start();
}catch(e){logPro("VOICE ERROR: Not supported");}

// Crypto Price + Sparkline
let priceHistory=[];
async function fetchPrice(){
  try{
    const resp=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
    const data=await resp.json();
    const price=data.bitcoin.usd;
    const priceEl=document.getElementById('btcPrice');
    // Pulse effect
    if(priceEl.innerText!=="--"){
      const oldPrice=parseFloat(priceEl.innerText.replace(/[^0-9.-]+/g,""));
      if(price>oldPrice){priceEl.style.color="#0f0";}
      else if(price<oldPrice){priceEl.style.color="#f00";}
      setTimeout(()=>{priceEl.style.color="#0ff";},500);
    }
    priceEl.innerText="$"+price.toLocaleString();
    logPro("PRICE UPDATED: $"+price);
    // Sparkline
    priceHistory.push(price);
    if(priceHistory.length>20) priceHistory.shift();
    renderSparkline();
  }catch(err){logPro("PRICE FETCH ERROR");}
}
setInterval(fetchPrice,5000);
fetchPrice();

// Render Sparkline using Chart.js
let sparkCtx=document.getElementById('sparkline').getContext('2d');
let sparkChart=new Chart(sparkCtx,{
  type:'line',
  data:{labels:Array(20).fill(''),datasets:[{data:[],borderColor:'#0ff',borderWidth:2,pointRadius:0,fill:false,lineTension:0.3} ]},
  options:{animation:{duration:300},responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}
});
function renderSparkline(){sparkChart.data.datasets[0].data=priceHistory;sparkChart.update();}
</script>
</body>
</html>
